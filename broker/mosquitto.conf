# Broker local para desarrollo del nodo Edifika (sin TLS ni usuarios: solo red de casa/laboratorio)
listener 1883 0.0.0.0
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type subscribe
log_type unsubscribe
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
